<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container text-center" style="max-width: 400px;">
        <h2 class="mb-4 text-primary">🌍 Welcome Traveler</h2>
        <div class="card shadow-sm p-4">
            <form method="POST" action="/login">
                {% if error %} <div class="alert alert-danger">{{ error }}</div> {% endif %}
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Enter Username (e.g. yash)" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login / Register</button>
            </form>
            <small class="text-muted mt-3 d-block">If account doesn't exist, it will be auto-created.</small>
        </div>
    </div>
</body>
</html>
